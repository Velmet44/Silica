# Silica — CI sketch (GitHub Actions)
# Place at .github/workflows/ci.yml in the repo. Mirrors TESTING.md.

name: ci
on:
  push: { branches: [main] }
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release
        # release: overflow-checks = true is part of the contract (SPEC D2)

  wasm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: jetli/wasm-pack-action@v0.4.0
      - run: wasm-pack test --node crates/silica-wasm

  golden:
    # D8: same hashes on every platform — this job is the determinism contract
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --test golden
      # AGENTS.md rule 7: a failing golden is NEVER regenerated by CI or by an
      # agent. A hash change requires a PR justification from a human.

  golden-wasm:
    # TESTING.md pillar 1 runs the suite on four platforms; D8 includes wasm32.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: jetli/wasm-pack-action@v0.4.0
      # golden world generators are kept wasm-friendly (no fs, no std-only
      # APIs) so the same manifest asserts identically in Node
      - run: wasm-pack test --node --release crates/silica-wasm -- --test golden

  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --test differential
      # reference interpreter vs optimized solver, 50 seeded random worlds

  bench:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench --bench canonical_worlds | tee bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench.txt
      # informational artifact + review gate; wire a >5% regression check to
      # critcmp once a baseline storage is chosen (cache or LFS)

  soak:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release --bin soak -- --ticks 1000000 --world random_soup --memory-ceiling-mb 250
